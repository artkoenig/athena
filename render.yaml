# Render Blueprint for argus (tools/argus).
#
# Render only reads blueprints from the repository root, which is why this file
# sits here rather than next to the tool it deploys. `rootDir` below keeps the
# build scoped to the tool, so nothing else in the repository is involved.
#
# To use it: render.com → New → Blueprint → pick this repository.
#
# The disk keeps what a restart drops. The store lives only in the process, and
# `--persist` only ever writes, so a deploy or restart comes up on a fresh
# measurement either way — with the disk the earlier records are still on it,
# to be read back with `--open` from a process that has it; without one they
# are gone. A disk also pins the service to a single instance, which is exactly
# what this app needs — the store is in memory, so a second instance does not
# share the load, it hides half the telemetry. `argus check` measures that and
# says so.

services:
  - type: web
    name: argus
    runtime: docker
    rootDir: tools/argus
    dockerfilePath: ./Dockerfile
    plan: starter # free has no disk and sleeps when idle; both lose the history
    region: frankfurt
    healthCheckPath: /api/health # deliberately reachable without the token
    autoDeploy: false

    disk:
      name: telemetry
      mountPath: /data # the Dockerfile already exports ATHENA_OBS_PERSIST=/data
      sizeGB: 1

    envVars:
      # Render assigns the port and routes to it; the Dockerfile's own default
      # would otherwise take precedence over what Render injects.
      - key: ATHENA_OBS_PORT
        value: 10000
      - key: ATHENA_OBS_HOST
        value: 0.0.0.0
      # A collector on a public URL accepts telemetry from anyone who finds it,
      # so the token is not optional here. Render generates it once; read it in
      # the dashboard under Environment, or off the first lines of the log.
      - key: ATHENA_OBS_TOKEN
        generateValue: true
      - key: ATHENA_OBS_RETENTION
        value: 7d
